name: Build desktop calendar (Windows)
on:
  workflow_dispatch:
  push:
    branches: [claude/desktop-calendar-yysenh]
    paths: ['desktop-calendar/**']
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-calendar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-calendar-windows
          path: desktop-calendar/dist/*.exe
